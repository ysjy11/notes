# =========================================================
# rules-规则
# =========================================================
rules:
  # 1.本地 / 局域网 / 私有地址（最高优先级）
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,private,DIRECT    
  - GEOIP,cn,DIRECT
  #  国内域名 + 国内 IP 直连
  - GEOSITE,cn,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,cn,DIRECT,no-resolve

  
  # 2.支付 / 银行 / 国内核心服务强制直连（防止被误代理）
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,alipayobjects.com,DIRECT
  - DOMAIN-SUFFIX,alipay.cn,DIRECT
  - DOMAIN-SUFFIX,alipayhk.com,DIRECT
  - DOMAIN-SUFFIX,antgroup.com,DIRECT
  - DOMAIN-SUFFIX,antfin.com,DIRECT
  - DOMAIN-SUFFIX,tenpay.com,DIRECT
  - DOMAIN-SUFFIX,wechatpay.cn,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,wx.qq.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,unionpay.com,DIRECT
  - DOMAIN-SUFFIX,unionpaysecure.com,DIRECT
  - DOMAIN-SUFFIX,95516.com,DIRECT
  - DOMAIN-KEYWORD,alipay,DIRECT
  - DOMAIN-KEYWORD,tenpay,DIRECT
  
  # 3.需要代理的服务、镜像、域名
  # ---谷歌相关（解决 Google Play 下载问题的关键）---
  - DOMAIN-SUFFIX,googleapis.cn,🌍 节点选择
  - DOMAIN-SUFFIX,services.googleapis.cn,🌍 节点选择
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🌍 节点选择
  - DOMAIN-SUFFIX,googleapis.com,🌍 节点选择
  - DOMAIN-SUFFIX,gstatic.com,🌍 节点选择
  - DOMAIN-SUFFIX,googleusercontent.com,🌍 节点选择
  - DOMAIN-SUFFIX,gvt1.com,🌍 节点选择
  - DOMAIN-SUFFIX,gvt2.com,🌍 节点选择
  - DOMAIN-SUFFIX,gvt3.com,🌍 节点选择
  - GEOSITE,google,🌍 节点选择
  
  # --- Telegram ---
  - GEOSITE,telegram,🌍 节点选择
  - GEOIP,telegram,🌍 节点选择,no-resolve
  
    # --- 常见需要代理的服务 ---
  - GEOSITE,youtube,🌍 节点选择
  - GEOSITE,netflix,🌍 节点选择
  - GEOSITE,disney,🌍 节点选择
  - GEOSITE,spotify,🌍 节点选择
  - GEOSITE,github,🌍 节点选择
  - GEOSITE,twitter,🌍 节点选择
  - GEOSITE,facebook,🌍 节点选择
  - GEOSITE,instagram,🌍 节点选择
  - GEOSITE,tiktok,🌍 节点选择
  - GEOSITE,openai,🌍 节点选择
  - GEOSITE,anthropic,🌍 节点选择
  
  # 4. 云端 GFW 规则集（动态补充那些旧 GEOSITE 没覆盖到的新兴国外网站）
  - RULE-SET,google_domain,🌍 节点选择
  - RULE-SET,telegram_domain,🌍 节点选择
  - GEOSITE,gfw,🌍 节点选择
  - RULE-SET,youtube_domain,🌍 节点选择
  - RULE-SET,github_domain,🌍 节点选择
  - RULE-SET,telegram_domain,🌍 节点选择
  - RULE-SET,netflix_domain,🌍 节点选择
  - RULE-SET,geolocation_not_cn,🌍 节点选择
  
   # 5. 兜底规则（建议放最后）
  - MATCH,🐟 漏网之鱼
  
 
 
  
# =========================================================
# 规则集配置 (MRS 高性能二进制规则集)
# =========================================================
anchor-domain: &domain
  type: http
  interval: 86400
  behavior: domain
  format: mrs

anchor-ip: &ip
  type: http
  interval: 86400
  behavior: ipcidr
  format: mrs
  
anchor-domain-text: &domain_text
  type: http
  interval: 86400
  behavior: domain
  format: text


