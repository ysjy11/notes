# ==================
# 基础设置
# ==================
mixed-port: 7890                  # HTTP(S)代理服务器端口
socks-port: 7891                  # SOCKS5 代理端口
redir-port: 7892                  # 透明代理端口，用于 Linux 和 MacOS
tproxy-port: 7893			      # 开启透明代理端口
allow-lan: true                   # 允许局域网连接
bind-address: "*"                 # 允许来自Docker 网桥的所有流量
mode: rule                        # 规则模式
log-level: info                   # 日志级别
ipv6: true                        # 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
unified-delay: true               # 统一延迟显示
tcp-concurrent: true              # 允许 TCP 快速开启
sniff: true
sniff-override-destination: true  
geodata-mode: true                # 开启内存映射
find-process-mode: strict         # always, 开启强制匹配所有进程;strict, 默认，由 mihomo 判断是否开启;off, 不匹配进程，推荐在路由器上使用此模式
geo-auto-update: true            # 是否自动更新 geodata
geo-update-interval: 24           # 更新间隔，单位：小时
#authentication:                  # http,socks入口的验证用户名，密码
#  - "username:password"


# ==================
# UI配置
# ==================
external-controller: 0.0.0.0:9090  # 允许外部控制
external-controller-tls: 0.0.0.0:9444
secret: "ysjy11"                   # 控制面板密码

# 默认面板配置（自动下载并解压 Zashboard 到 ui 目录）
external-ui: ./ui    # 预留面板路径
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
external-ui-name: metacubexd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# 允许跨域请求（极其重要！支持在线版 Metacubexd / Zashboard 直连）
cors:
  allow-origins:
    - '*'
  allow-private-network: true


# ==================
# TUN 配置
# ==================
tun:
  enable: true
  stack: system
  mtu: 1400
  gso: true
  auto-route: true #自动添加路由规则
  auto-redirect: true  # 必須為 true，讓它接管宿主機路由
  auto-detect-interface: true # 自动检测出口网卡,必須為 true，自動識別宿主機上網的真實網卡
  strict-route: true
  dns-hijack:         # 需要劫持的 DNS
    - any:53
    - tcp://any:53
  route-exclude-address:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 127.0.0.0/8
    
# 可选：如果遇到部分 Docker 容器网络冲突，可以排除特定的 docker 网卡
#  include-interface:
  exclude-interface:
    - docker0
#    - br-proxy
  endpoint-independent-nat: true



# ==================
# DNS 模块
# ==================
dns:                               
  cache-algorithm: arc
  enable: true                    # 开启/关闭将使用系统DNS
  prefer-h3: true                 # 是否开启DoH，支持 HTTP/3，将并发尝试
  listen: 0.0.0.0:1053            # 开启 DNS 服务器监听
  ipv6: true                      # ?
  respect-rules: true

  enhanced-mode: fake-ip          # fake-ip模式可能会让adg广告规则失效(redir-host)
  fake-ip-range: 198.18.0.1/16    # fake-ip 池设置
  fake-ip-filter-mode: blacklist  # 默认为blacklist，即如果匹配成功不返回fake-ip
    # 可设置为whitelist，即只有匹配成功才返回fake-ip
    # 也可配置为rule，规则模式语法见fake-ip-filter说明
  fake-ip-ttl: 60
  fake-ip-filter:                 # 不使用fake-ip的域名
    # 局域网 & 系统检测（不返回 fake-ip）
    - '*.lan'
    - '*.local'
    - '+.local'
    - '+.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - localhost.ptlogin2.qq.com
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - dns.msftncsi.com
    - geosite:cn
    - geosite:private

#    - rule-set:fakeip-filter
#    - geosite:fakeip-filter                  # fakeip-filter 为 geosite 中名为 fakeip-filter 的分类（需要自行保证该分类存在）
#    - rule-set:fakeipfilter_cn         
#    - rule-set:fakeipfilter_!cn         
#    - rule-set:private_domain
#    - GEOSITE,gfw,fake-ip
#    - RULE-SET,reject-domain,fake-ip         # 自定义 RuleSet behavior 必须为 domain/classical，当为 classical 时仅会生效域名类规则
#    - RULE-SET,proxy-domain,fake-ip
#    - DOMAIN,www.baidu.com,real-ip
#    - DOMAIN-SUFFIX,qq.com,real-ip
#    - DOMAIN-SUFFIX,jd.com,fake-ip
#    - MATCH,fake-ip     # 最后 fake-ip or real-ip

  default-nameserver:             # 用于解析nameserver、fallback以及其他DNS服务器配置的DNS服务域名。只能使用纯IP地址，可使用加密DNS。
    - tls://223.5.5.5
    - tls://223.6.6.6
    - tls://119.29.29.29
  nameserver:                     # 主要DNS配置，用国内DNS(域名或IP）
    - 192.168.50.250:53   # 将未命中直连的请求交由同 Docker 下的 AdGuard Home 处理，由 AGH 统一过滤广告并向上游公网IP转发
    # - 114.114.114.114 # default value
    # - 8.8.8.8 # default value
    # - tls://223.5.5.5:853 # DNS over TLS
#    - https://doh.pub/dns-query # DNS over HTTPS
#    - https://dns.alidns.com/dns-query
  nameserver-policy:              # 查询域名使用的DNS，用国内DNS(域名)
    #   'www.baidu.com': '114.114.114.114'
    #   '+.internal.crop.com': '10.0.0.1'
    # 谷歌商店专用（强制走国外 DNS）
    "+.googleapis.cn,+.xn--ngstr-lra8j.com,+.googleapis.com,+.gstatic.com":
      - https://8.8.8.8/dns-query
      - https://1.1.1.1/dns-query
     # 国内走国内
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:category-ads-all": rcode://success
    "www.baidu.com,+.google.cn": [223.5.5.5, https://dns.alidns.com/dns-query, https://1.1.1.1/dns-query]
    ## global，dns 为 rule-providers 中的名为 global 和 dns 规则订阅，
    ## 且 behavior 必须为 domain/classical，当为 classical 时仅会生效域名类规则
    # "rule-set:global,dns": 8.8.8.8
  proxy-server-nameserver:        # 解析机场订阅及节点域名的DNS，用国内DNS(域名)，非必设置项
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:              # 用于direct直连出口域名解析的DNS服务器，用国内DNS(域名)，非必要配置项
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:                       # 当配置fallback时，会查询 nameserver 中返回的 IP 是否为 CN，当不是CN，则使用 fallback 中的 DNS 查询结果,非必要配置
     - https://1.1.1.1/dns-query
     - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
     geoip: true    # 配置是否使用 geoip
     geoip-code: CN # 当 nameserver 解析出域名的 IP 查询 geoip 库为 CN 时， 使用 nameserver 中的 DNS 查询结果
    #   ipcidr:        # 当 nameserver 解析出域名的 IP 匹配 ipcidr 时，使用 fallback 中的 DNS 查询结果
    #     - 240.0.0.0/4
    #     - 0.0.0.0/32
    #     - 127.0.0.1/32
    #     - 100.64.0.0/10
    #   domain:        # 匹配到这些域名，会直接使用 fallback 解析，不去使用 nameserver
    #     - '+.google.com'
    #     - '+.facebook.com'
    #     - '+.youtube.com'
    #   geosite:       # 匹配到这些域名，会直接使用 fallback 解析，不去使用 nameserver（已废弃，请使用 nameserver-policy）
    #     - gfw
    # fallback-lazy-query: false # 默认值为 false ，如果为 true 会先判断来自 nameserver 的结果是否满足 fallback-filter 后再发起查询


# =========================================================
# 机场节点归属判断,显示小国旗 (YAML 锚点全局模板)
# =========================================================
x-override-flags: &node-flags
  proxy-name:
    # 香港
    - pattern: "(?i).*(港|hk|HK|hong.?kong|hongkong|hkg).*"
      target: "🇭🇰 $0"
    # 台湾
    - pattern: "(?i).*(台|tw|taiwan|tpe).*"
      target: "🇹🇼 $0"
    # 日本
    - pattern: "(?i).*(日|jp|japan|东京|大阪|名古屋|nrt|hnd|kix|tyo|orhy).*"
      target: "🇯🇵 $0"
    # 新加坡
    - pattern: "(?i).*(新|sg|singapore|sin|狮城).*"
      target: "🇸🇬 $0"
    # 韩国
    - pattern: "(?i).*(韩|kr|korea|首尔|icn).*"
      target: "🇰🇷 $0"
    # 美国
    - pattern: "(?i).*(美|us|usa|united.?states|america|洛杉矶|西雅图|纽约|芝加哥|硅谷|达拉斯|lax|sjc|sea|nyc|sfo|iad|dfw|vvv|band2).*"
      target: "🇺🇸 $0"
    # 英国
    - pattern: "(?i).*(英|uk|gb|britain|london|lhr).*"
      target: "🇬🇧 $0"
    # 德国
    - pattern: "(?i).*(德|de|germany|frankfurt|fra|柏林).*"
      target: "🇩🇪 $0"
    # 法国
    - pattern: "(?i).*(法|fr|france|paris|cdg).*"
      target: "🇫🇷 $0"
    # 加拿大
    - pattern: "(?i).*(加|ca|canada|toronto|yyz).*"
      target: "🇨🇦 $0"
    # 澳大利亚
    - pattern: "(?i).*(澳|au|australia|sydney|melbourne|syd).*"
      target: "🇦🇺 $0"

